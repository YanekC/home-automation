- name: Upgrade first
  ansible.builtin.apt:
    upgrade: "full"
    update_cache: yes
- name: Uninstall packages
  ansible.builtin.apt:
    name: ["certbot"]
    state: absent
    update_cache: yes
- name: Install basic packages for installation
  ansible.builtin.apt:
    name:
      [
        "ca-certificates",
        "curl",
        "gnupg",
        "pip",
        "ufw",
        "ddclient",
        "snapd",
        "rtl-433",
        "nut",
        "python3-debian",
      ]
    state: present
    update_cache: yes
