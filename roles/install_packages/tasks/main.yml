- name: Install docker packages
  ansible.builtin.apt:
    name:
      [
        "docker-ce",
        "docker-ce-cli",
        "containerd.io",
        "docker-buildx-plugin",
        "docker-compose-plugin",
      ]
    state: present
    update_cache: yes
- name: Install docker SDK package
  ansible.builtin.pip:
    name: ["docker"]

- name: clean docker
  community.docker.docker_prune:
    containers: true
    images: true
    networks: true
    volumes: true
    builder_cache: true
