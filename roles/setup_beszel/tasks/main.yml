- name: Create directory yanck/beszel
  ansible.builtin.file:
    path: "{{ home_path_beszel }}"
    state: directory

- name: create beszel user
  ansible.builtin.user:
    name: beszel
    uid: 1001
    create_home: no
    groups: disk
    append: yes

- name: Copy docker compose file
  ansible.builtin.copy:
    src: ../files/compose.yml
    dest: "{{ home_path_beszel }}"
    force: true

- name: Tear down beszel services
  community.docker.docker_compose_v2:
    project_src: "{{ home_path_beszel }}"
    state: absent

- name: Create and start beszel services
  community.docker.docker_compose_v2:
    project_src: "{{ home_path_beszel }}"
    pull: always
