services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://192.168.2.195:8090
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    group_add:
      - 6 #disk
    volumes:
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/gros_disque/.beszel:/extra-filesystems/gros_disque:ro
      - /mnt/hdd_freecom/.beszel:/extra-filesystems/hdd_freecom:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://192.168.2.195:8090
      # Do not remove quotes around the key
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBG9Y3x8fhOvCx3//aXMW4Io9wi0GbPd6UQ94pNHyKft"
      TOKEN: "11340-a272d17c-206c1-b248bb9a8"
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
